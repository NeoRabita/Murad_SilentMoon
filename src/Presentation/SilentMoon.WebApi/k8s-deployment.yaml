apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi-deployment
spec:
  # Number of API instances you want to run
  replicas: 3
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      containers:
      - name: webapi
        # Local image name without Docker Hub prefix
        image: my-local-webapi:latest
        # Crucial: Tells Kubernetes to use the local image and not check the internet
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webapi-service
spec:
  # Expose the service locally/externally
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: webapi
